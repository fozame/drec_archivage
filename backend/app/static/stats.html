<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Statistiques</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <span class="titre">Factures ART</span>
  <a href="/static/index.html">Importer</a>
  <a href="/static/revue.html">Verifier / renommer</a>
  <a href="/static/recherche.html">Rechercher</a>
  <a href="/static/stats.html" class="actif">Statistiques</a>
</nav>

<main>
  <h1>Statistiques</h1>
  <p class="sous-titre">Vue d'ensemble des factures archivees.</p>

  <div class="cartes-stats" id="cartes-stats"></div>

  <div class="grille-graphiques">
    <div class="panel">
      <h2>Par delegation</h2>
      <div id="graphique-delegation" class="barres"></div>
    </div>
    <div class="panel">
      <h2>Par produit</h2>
      <div id="graphique-produit" class="barres"></div>
    </div>
  </div>

  <div class="panel" style="margin-top:20px;">
    <h2>Evolution (12 derniers mois)</h2>
    <div id="graphique-mois" class="barres barres-mois"></div>
  </div>
</main>

<script src="/static/app.js"></script>
<script>
function dessinerBarres(conteneurId, donnees, cleLabel = "cle") {
  const conteneur = document.getElementById(conteneurId);
  if (donnees.length === 0) {
    conteneur.innerHTML = `<p style="color:#6b7280;font-size:14px;">Aucune donnee pour le moment.</p>`;
    return;
  }
  const max = Math.max(...donnees.map(d => d.total), 1);
  conteneur.innerHTML = donnees.map(d => `
    <div class="ligne-barre">
      <div class="barre-label">${d[cleLabel]}</div>
      <div class="barre-piste">
        <div class="barre-remplissage" style="width:${(d.total / max * 100).toFixed(1)}%"></div>
      </div>
      <div class="barre-valeur">${d.total}</div>
    </div>
  `).join("");
}

function formatMois(cleMois) {
  const [annee, mois] = cleMois.split("-");
  const noms = ["Jan", "Fev", "Mar", "Avr", "Mai", "Juin", "Juil", "Aout", "Sep", "Oct", "Nov", "Dec"];
  return `${noms[parseInt(mois, 10) - 1]} ${annee}`;
}

async function chargerStats() {
  const stats = await appelApi("/api/stats");

  document.getElementById("cartes-stats").innerHTML = `
    <div class="carte-stat">
      <div class="carte-valeur">${stats.total_factures}</div>
      <div class="carte-label">Factures archivees</div>
    </div>
    <div class="carte-stat">
      <div class="carte-valeur">${stats.total_en_attente}</div>
      <div class="carte-label">En attente de verification</div>
    </div>
    <div class="carte-stat">
      <div class="carte-valeur">${stats.score_moyen}%</div>
      <div class="carte-label">Score de confiance moyen</div>
    </div>
  `;

  dessinerBarres("graphique-delegation", stats.par_delegation);
  dessinerBarres("graphique-produit", stats.par_produit);

  const parMois = stats.par_mois.map(m => ({ cle: formatMois(m.mois), total: m.total }));
  dessinerBarres("graphique-mois", parMois);
}

chargerStats();
</script>
</body>
</html>
