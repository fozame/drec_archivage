<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rechercher une facture</title>
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
<nav>
  <span class="titre">Factures ART</span>
  <a href="/static/index.html">Importer</a>
  <a href="/static/revue.html">Verifier / renommer</a>
  <a href="/static/recherche.html" class="actif">Rechercher</a>
  <a href="/static/stats.html">Statistiques</a>
</nav>

<main>
  <h1>Rechercher une facture</h1>
  <p class="sous-titre">Par numero de facture, nom de l'exploitant ou code client. Clique sur une ligne pour visualiser, imprimer, naviguer ou supprimer.</p>

  <div class="barre-recherche">
    <input type="text" id="champ-recherche" placeholder="ex: ORANGE, 26A/FH/D/464, DLT-464...">
    <button class="primaire" id="btn-rechercher">Rechercher</button>
  </div>

  <table class="resultats">
    <thead>
      <tr>
        <th>Numero de facture</th>
        <th>Exploitant</th>
        <th>Produit</th>
        <th>Delegation</th>
        <th>Code client</th>
        <th>Importee le</th>
      </tr>
    </thead>
    <tbody id="corps-resultats"></tbody>
  </table>
</main>

<!-- Visionneuse : image + navigation precedent/suivant + impression + suppression -->
<div class="visionneuse" id="visionneuse">
  <div class="visionneuse-barre">
    <div>
      <strong id="v-numero"></strong>
      <span id="v-nom" style="color:#9ca3af; margin-left:10px;"></span>
      <span id="v-position" style="color:#6b7280; margin-left:10px; font-size:13px;"></span>
    </div>
    <div class="visionneuse-actions">
      <button id="v-zoom" title="Alterne : page entiere / pleine largeur (defilement)">Pleine largeur</button>
      <button id="v-modifier">Modifier</button>
      <button id="v-imprimer">Imprimer</button>
      <button class="danger" id="v-supprimer">Supprimer</button>
      <button id="v-fermer">✕ Fermer</button>
    </div>
  </div>
  <div class="visionneuse-edition" id="v-edition">
    <label>Numero <input type="text" id="e-numero" placeholder="26A/REPDIP/D/123"></label>
    <label>Exploitant <input type="text" id="e-nom"></label>
    <button class="primaire" id="e-enregistrer">Enregistrer</button>
    <button id="e-annuler">Annuler</button>
  </div>
  <div class="visionneuse-corps">
    <button class="v-nav" id="v-precedent" title="Precedent (fleche gauche)">&#8592;</button>
    <div class="v-scene" id="v-scene"><img id="v-image" alt=""></div>
    <button class="v-nav" id="v-suivant" title="Suivant (fleche droite)">&#8594;</button>
  </div>
</div>

<script src="/static/app.js?v=4"></script>
<script>
const champRecherche = document.getElementById("champ-recherche");
const corpsResultats = document.getElementById("corps-resultats");

let resultatsActuels = [];
let indexActuel = -1;

async function rechercher() {
  const q = champRecherche.value.trim();
  resultatsActuels = await appelApi(`/api/factures?q=${encodeURIComponent(q)}`);
  corpsResultats.innerHTML = resultatsActuels.map((f, i) => `
    <tr data-index="${i}">
      <td>${f.numero_facture}</td>
      <td>${f.nom_exploitant}</td>
      <td>${f.produit || '-'}</td>
      <td>${f.delegation || '-'}</td>
      <td>${f.code_client || '-'}</td>
      <td>${new Date(f.date_import).toLocaleDateString('fr-FR')}</td>
    </tr>
  `).join("") || `<tr><td colspan="6" style="text-align:center;color:#6b7280;">Aucun resultat</td></tr>`;

  corpsResultats.querySelectorAll("tr[data-index]").forEach(tr => {
    tr.onclick = () => ouvrirVisionneuse(parseInt(tr.dataset.index, 10));
  });
}

document.getElementById("btn-rechercher").onclick = rechercher;
champRecherche.addEventListener("keydown", e => { if (e.key === "Enter") rechercher(); });

// --- Visionneuse ---

const visionneuse = document.getElementById("visionneuse");
const vImage = document.getElementById("v-image");
const vNumero = document.getElementById("v-numero");
const vNom = document.getElementById("v-nom");
const vPosition = document.getElementById("v-position");

function ouvrirVisionneuse(index) {
  indexActuel = index;
  afficherFactureActuelle();
  visionneuse.classList.add("visible");
  document.body.classList.add("verrouille"); // empeche de scroller la page derriere
}

function afficherFactureActuelle() {
  const f = resultatsActuels[indexActuel];
  if (!f) return;
  vScene.scrollTop = 0;
  vImage.src = `/api/factures/${f.id}/fichier?t=${Date.now()}`;
  vNumero.textContent = f.numero_facture;
  vNom.textContent = f.nom_exploitant;
  vPosition.textContent = `${indexActuel + 1} / ${resultatsActuels.length}`;
}

function fermerVisionneuse() {
  visionneuse.classList.remove("visible");
  document.body.classList.remove("verrouille");
  vImage.src = "";
}

function facturePrecedente() {
  if (indexActuel > 0) { indexActuel--; afficherFactureActuelle(); }
}

function factureSuivante() {
  if (indexActuel < resultatsActuels.length - 1) { indexActuel++; afficherFactureActuelle(); }
}

const vScene = document.getElementById("v-scene");
const vZoom = document.getElementById("v-zoom");
vZoom.onclick = () => {
  const largeur = vScene.classList.toggle("largeur");
  vZoom.textContent = largeur ? "Page entiere" : "Pleine largeur";
  vScene.scrollTop = 0;
};
vImage.onclick = () => vZoom.click();
document.getElementById("v-fermer").onclick = fermerVisionneuse;
document.getElementById("v-precedent").onclick = facturePrecedente;
document.getElementById("v-suivant").onclick = factureSuivante;

document.addEventListener("keydown", e => {
  if (!visionneuse.classList.contains("visible")) return;
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") fermerVisionneuse();
  if (e.key === "ArrowLeft") facturePrecedente();
  if (e.key === "ArrowRight") factureSuivante();
});

// Impression : on construit une mini-page dont l'image est ajustee a une
// feuille A4 (marges 10 mm, proportions conservees, rien n'est coupe), puis
// on imprime cette page dans un iframe cache.
document.getElementById("v-imprimer").onclick = () => {
  const f = resultatsActuels[indexActuel];
  if (!f) return;
  const url = `${location.origin}/api/factures/${f.id}/fichier`;
  const iframe = document.createElement("iframe");
  iframe.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${f.numero_facture}</title>
    <style>
      @page { margin: 8mm; }
      html, body { margin: 0; padding: 0; }
      body { text-align: center; }
      img { display: block; margin: 0 auto; max-width: 100%; max-height: 255mm;
            width: auto; height: auto; object-fit: contain; page-break-inside: avoid; break-inside: avoid; }
    </style></head><body><img id="im" src="${url}"></body></html>`);
  doc.close();
  const im = doc.getElementById("im");
  const lancer = () => {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(() => iframe.remove(), 2000);
  };
  if (im.complete) lancer(); else { im.onload = lancer; im.onerror = () => { afficherToast("Impossible de charger l'image", true); iframe.remove(); }; }
};

// Modification d'une facture deja archivee (numero / exploitant)
const vEdition = document.getElementById("v-edition");
document.getElementById("v-modifier").onclick = () => {
  const f = resultatsActuels[indexActuel];
  if (!f) return;
  document.getElementById("e-numero").value = f.numero_facture;
  document.getElementById("e-nom").value = f.nom_exploitant;
  vEdition.classList.toggle("visible");
};
document.getElementById("e-annuler").onclick = () => vEdition.classList.remove("visible");
document.getElementById("e-enregistrer").onclick = async () => {
  const f = resultatsActuels[indexActuel];
  try {
    const maj = await appelApi(`/api/factures/${f.id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        numero_facture: document.getElementById("e-numero").value,
        nom_exploitant: document.getElementById("e-nom").value,
      }),
    });
    resultatsActuels[indexActuel] = maj;
    vEdition.classList.remove("visible");
    afficherFactureActuelle();
    afficherToast("Facture modifiee et reclassee.");
    // rafraichit le tableau en arriere-plan sans perdre la position
    corpsResultats.querySelector(`tr[data-index="${indexActuel}"]`).innerHTML = `
      <td>${maj.numero_facture}</td><td>${maj.nom_exploitant}</td><td>${maj.produit || '-'}</td>
      <td>${maj.delegation || '-'}</td><td>${maj.code_client || '-'}</td>
      <td>${new Date(maj.date_import).toLocaleDateString('fr-FR')}</td>`;
  } catch (err) {
    afficherToast("Erreur : " + err.message, true);
  }
};

document.getElementById("v-supprimer").onclick = async () => {
  const f = resultatsActuels[indexActuel];
  if (!f) return;
  if (!confirm(`Supprimer definitivement la facture "${f.numero_facture}" (${f.nom_exploitant}) ?\nCette action est irreversible.`)) return;

  try {
    await appelApi(`/api/factures/${f.id}`, { method: "DELETE" });
    afficherToast("Facture supprimee.");
    resultatsActuels.splice(indexActuel, 1);
    if (resultatsActuels.length === 0) {
      fermerVisionneuse();
    } else {
      if (indexActuel >= resultatsActuels.length) indexActuel = resultatsActuels.length - 1;
      afficherFactureActuelle();
    }
    rechercher();
  } catch (err) {
    afficherToast("Erreur : " + err.message, true);
  }
};

rechercher();
</script>
</body>
</html>
